<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='login/style.css') }}">
    <title>Editar Nota</title>
</head>

<body class="notes-page">
    <div class="note-form-card">
        <div class="form-heading">
            <h1>Editar Nota</h1>
            <a href="{{ url_for('notes.home') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>
        <form method="POST">
            <label for="title">Título</label>
            <input type="text" name="title" id="title" value="{{ note.title }}" required>

            <label for="content">Contenido</label>
            <textarea name="content" id="content" required>{{ note.content }}</textarea>

            <input type="submit" value="Guardar Nota">
        </form>
    </div>
</body>

</html>
